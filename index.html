<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Alexxis Jane Mantilla | Sales Architect</title>
  <style>
    :root {
      --copper: #775537;
      --yellow: #FBE29D;
      --nebula: #C0DDDA;
      --seashell: #F1F1F1;
      
      --text-main: #333333;
      --text-muted: #555555;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
    }

    body {
      background-color: var(--seashell);
      color: var(--text-main);
      min-height: 100vh;
      display: flex;
      justify-content: center;
      align-items: center;
      padding: 24px;
    }

    .card-container {
      background-color: #ffffff;
      border: 1px solid #e0e0e0;
      border-radius: 12px;
      width: 100%;
      max-width: 400px;
      padding: 40px 30px;
      text-align: center;
      box-shadow: 0 10px 20px rgba(0,0,0,0.05);
    }

    h1 {
      font-size: 1.6rem;
      font-weight: 700;
      color: var(--copper);
      margin-bottom: 8px;
    }

    .nickname {
      font-weight: 400;
      font-size: 1.1rem;
      color: var(--text-muted);
    }

    .title {
      font-size: 1rem;
      color: var(--text-main);
      font-weight: 600;
      margin-bottom: 24px;
    }

    .line-spacer {
      border-top: 2px solid var(--yellow);
      width: 60px;
      margin: 0 auto 24px;
    }

    .qr-section {
      background-color: #ffffff;
      padding: 10px;
      display: inline-block;
      margin-bottom: 12px;
      border: 1px solid #eeeeee;
      border-radius: 8px;
    }

    .qr-section img {
      display: block;
      width: 160px;
      height: 160px;
    }

    .qr-label {
      font-size: 0.8rem;
      color: var(--text-muted);
      margin-bottom: 30px;
    }

    .links {
      display: flex;
      flex-direction: column;
      gap: 12px;
    }

    .btn {
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 12px 20px;
      border-radius: 8px;
      text-decoration: none;
      font-weight: 500;
      font-size: 0.9rem;
      transition: background-color 0.2s ease;
      background-color: var(--seashell);
      color: var(--copper);
      border: 1px solid #dcdcdc;
    }

    .btn:hover {
      background-color: var(--yellow);
    }

    .btn-contact {
      background-color: var(--copper);
      color: #ffffff;
      border: none;
    }

    .btn-contact:hover {
      background-color: #8a6546;
    }
  </style>
</head>
<body>

  <div class="card-container">
    
    <h1>Alexxis Jane Mantilla</h1>
    <p class="nickname">"Lexi"</p>
    <div class="line-spacer"></div>
    <p class="title">Sales Architect</p>

    <!-- vCard QR Code (Directly formatted to prompt phone contact saving) -->
    <div class="qr-section">
      <img src="https://quickchart.io/qr?text=MECARD%3AN%3AAlexxis+Jane+Mantilla%3BORG%3ADiversifiedsource+Inc.%3BTEL%3A%2B63+964+756+8540%3BURL%3Ahttps%3A%2F%2Fleximantilla.github.io%2Fdigitalcard%2F%3B%3B&size=160" alt="Scan to Save Contact">
    </div>
    <p class="qr-label">Scan to save contact info</p>

    <!-- Action Buttons -->
    <div class="links">
      <a href="tel:09647568540" class="btn btn-contact">📞 +63 964 756 8540</a>
      <a href="mailto:diversifiedsource.design@gmail.com" class="btn">✉️ email me</a>
      <a href="https://leximantilla.github.io/digitalcard/" class="btn">🌐 visit digital card</a>
    </div>

  </div>

</body>
</html>
