<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>LEXI MANTILLA | SALES ARCHITECT</title>
  
  <!-- Montserrat Font -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;500;600;700;800&display=swap" rel="stylesheet">

  <style>
    /* Strict 3-Color Palette */
    :root {
      --olivine: #9BAD50;
      --columbia: #B6CFE4;
      --van-dyke: #393027;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: 'Montserrat', 'Century Gothic', sans-serif;
    }

    body {
      background-color: var(--columbia);
      min-height: 100vh;
      display: flex;
      justify-content: center;
      align-items: center;
      padding: 20px;
    }

    /* Main Card Container */
    .card-container {
      background-color: var(--olivine);
      border-radius: 20px;
      width: 100%;
      max-width: 360px;
      padding: 48px 32px 40px;
      text-align: center;
      box-shadow: 0 15px 35px rgba(57, 48, 39, 0.15);
      display: flex;
      flex-direction: column;
      align-items: center;
    }

    /* Name - Prominent & Bold */
    h1 {
      font-size: 1.75rem;
      font-weight: 800;
      color: var(--van-dyke);
      letter-spacing: 0.14em;
      text-transform: uppercase;
      margin-bottom: 8px;
      line-height: 1.2;
    }

    /* Position - Supplementary Text */
    .title {
      font-size: 0.75rem;
      color: var(--van-dyke);
      font-weight: 600;
      letter-spacing: 0.22em;
      text-transform: uppercase;
      margin-bottom: 20px;
      opacity: 0.9;
    }

    /* Divider Accent */
    .accent-bar {
      height: 3px;
      width: 50px;
      background-color: var(--columbia);
      border-radius: 2px;
      margin-bottom: 28px;
    }

    /* Contact Links Stack */
    .info-group {
      display: flex;
      flex-direction: column;
      gap: 12px;
      margin-bottom: 28px;
      width: 100%;
    }

    .info-link {
      font-size: 0.85rem;
      font-weight: 500;
      color: var(--van-dyke);
      text-decoration: none;
      letter-spacing: 0.05em;
      transition: opacity 0.2s ease;
    }

    .info-link:hover {
      opacity: 0.7;
    }

    /* Location */
    .location {
      font-size: 0.8rem;
      font-weight: 600;
      color: var(--van-dyke);
      letter-spacing: 0.12em;
      text-transform: uppercase;
      margin-bottom: 32px;
    }

    /* vCard QR Code Container */
    .qr-section {
      background-color: var(--columbia);
      padding: 12px;
      border-radius: 16px;
      display: inline-block;
    }

    .qr-section img {
      display: block;
      width: 150px;
      height: 150px;
      mix-blend-mode: multiply; /* Blends QR code cleanly into the Columbia blue tile */
    }
  </style>
</head>
<body>

  <div class="card-container">
    
    <!-- Name -->
    <h1>LEXI MANTILLA</h1>
    <p class="title">SALES ARCHITECT</p>
    
    <!-- Accent Line -->
    <div class="accent-bar"></div>

    <!-- Contact Details -->
    <div class="info-group">
      <a href="tel:09647568540" class="info-link">0964 756 8540</a>
      <a href="mailto:lexi.mantillaa@gmail.com" class="info-link">lexi.mantillaa@gmail.com</a>
      <a href="https://instagram.com/alxsjne" target="_blank" rel="noopener" class="info-link">@alxsjne</a>
    </div>

    <!-- Location -->
    <div class="location">
      MAKATI | PHILIPPINES
    </div>

    <!-- vCard QR Code -->
    <div class="qr-section">
      <img src="https://quickchart.io/qr?text=MECARD%3AN%3ALexi+Mantilla%3BORG%3ADiversifiedsource+Inc.%3BTEL%3A%2B63+964+756+8540%3BEMAIL%3Alexi.mantillaa%40gmail.com%3BADR%3AMakati%2C+Philippines%3B%3B&size=150" alt="Scan to Save Contact">
    </div>

  </div>

</body>
</html>
