<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>LEXI MANTILLA | SALES ARCHITECT</title>
  
  <!-- Premium Architectural Typography: Plus Jakarta Sans -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">

  <style>
    /* Architectural Earthy Color Palette & Tokens */
    :root {
      --bg-warm: #F5F2EC;           /* Warm, organic background canvas */
      --card-bg: #FCFBF8;           /* Off-white luxury card surface */
      --primary-brown: #3A2C28;     /* Rich deep brown hero text */
      --secondary-brown: #8A6A52;   /* Soft warm brown secondary text */
      --divider-color: rgba(58, 44, 40, 0.35); /* Subtle pill divider */
      --border-subtle: rgba(0, 0, 0, 0.05);   /* Delicate card border */
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: 'Plus Jakarta Sans', -apple-system, BlinkMacSystemFont, sans-serif;
      -webkit-font-smoothing: antialiased;
    }

    body {
      background-color: var(--bg-warm);
      min-height: 100vh;
      display: flex;
      justify-content: center;
      align-items: center;
      padding: 32px 20px;
    }

    /* Architectural Card Container - Clean Floating Elevation */
    .card-container {
      background-color: var(--card-bg);
      border-radius: 38px;
      width: 100%;
      max-width: 380px;
      padding: 56px 36px 48px;
      text-align: center;
      box-shadow: 0 16px 40px rgba(0, 0, 0, 0.08);
      display: flex;
      flex-direction: column;
      align-items: center;
      border: 1px solid var(--border-subtle);
    }

    /* Hero Name */
    h1 {
      font-size: 1.8rem;
      font-weight: 800;
      color: var(--primary-brown);
      letter-spacing: 0.03em;
      text-transform: uppercase;
      margin-bottom: 8px;
      line-height: 1.15;
    }

    /* Job Title */
    .title {
      font-size: 0.75rem;
      color: var(--secondary-brown);
      font-weight: 500;
      letter-spacing: 0.18em;
      text-transform: uppercase;
      margin-bottom: 24px;
    }

    /* Refined Understated Divider */
    .divider-line {
      height: 2px;
      width: 60px;
      background-color: var(--divider-color);
      border-radius: 999px;
      margin-bottom: 32px;
    }

    /* Contact Details */
    .info-group {
      display: flex;
      flex-direction: column;
      gap: 14px;
      margin-bottom: 32px;
      width: 100%;
    }

    .info-link {
      font-size: 0.88rem;
      font-weight: 500;
      color: var(--primary-brown);
      text-decoration: none;
      letter-spacing: 0.01em;
      transition: opacity 0.2s ease;
      word-break: break-all;
      line-height: 1.4;
    }

    .info-link:hover {
      opacity: 0.7;
    }

    /* Location */
    .location {
      font-size: 0.72rem;
      font-weight: 600;
      color: var(--secondary-brown);
      letter-spacing: 0.16em;
      text-transform: uppercase;
      margin-bottom: 36px;
    }

    /* Premium Floating QR Container */
    .qr-section {
      background-color: #FFFFFF;
      padding: 24px;
      border-radius: 24px;
      display: inline-block;
      box-shadow: 0 12px 30px rgba(0, 0, 0, 0.06);
      border: 1px solid rgba(0, 0, 0, 0.06);
    }

    .qr-section img {
      display: block;
      width: 135px;
      height: 135px;
    }
  </style>
</head>
<body>

  <div class="card-container">
    
    <!-- Hero Name & Title -->
    <h1>LEXI MANTILLA</h1>
    <p class="title">SALES ARCHITECT</p>
    
    <!-- Minimalist Rounded Divider -->
    <div class="divider-line"></div>

    <!-- Contact Details -->
    <div class="info-group">
      <a href="tel:09647568540" class="info-link">0964 756 8540</a>
      <a href="mailto:lexi.mantillaa@gmail.com" class="info-link">lexi.mantillaa@gmail.com</a>
      <a href="https://instagram.com/alxsjne" target="_blank" rel="noopener" class="info-link">@alxsjne</a>
    </div>

    <!-- Location -->
    <div class="location">
      MAKATI | PHILIPPINES
    </div>

    <!-- Floating QR Code Card -->
    <div class="qr-section">
      <img src="https://quickchart.io/qr?text=BEGIN%3AVCARD%0AVERSION%3A3.0%0AN%3AMantilla%3BLexi%0AFN%3ALexi+Mantilla%0AORG%3ADiversifiedsource+Inc.%0ATITLE%3ASales+Architect%0ATEL%3A09647568540%0AEMAIL%3Alexi.mantillaa%40gmail.com%0AADR%3A%3B%3BMakati%3B%3B%3BPhilippines%0AEND%3AVCARD&size=135" alt="Scan to Save Contact">
    </div>

  </div>

</body>
</html>
