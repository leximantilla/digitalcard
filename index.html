<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>LEXI MANTILLA | SALES ARCHITECT</title>
  
  <!-- Montserrat Font -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;500;600;700;800&display=swap" rel="stylesheet">

  <style>
    /* Palette Tokens based on Image Palette */
    :root {
      --savory-sage: #818263;      /* Card Background Accent */
      --avocado-smoothie: #C2C395; /* Subtle Accents */
      --blush-beet: #DDBAAE;       /* Soft Divider Line */
      --peach-protein: #EFD7CF;    /* Main Body Outer Background */
      --oat-latte: #DCD4C1;        /* Central Card Container */
      --deep-sage-text: #2C3023;   /* High-Contrast Dark Text (Eye-friendly) */
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: 'Montserrat', 'Century Gothic', sans-serif;
    }

    body {
      background-color: var(--peach-protein);
      min-height: 100vh;
      display: flex;
      justify-content: center;
      align-items: center;
      padding: 20px;
    }

    /* Main Card Container */
    .card-container {
      background-color: var(--oat-latte);
      border-radius: 28px;
      width: 100%;
      max-width: 360px;
      padding: 48px 32px 40px;
      text-align: center;
      box-shadow: 0 20px 40px rgba(44, 48, 35, 0.1);
      display: flex;
      flex-direction: column;
      align-items: center;
      border: 1px solid rgba(129, 130, 99, 0.2);
    }

    /* Name - Clear & Eye-Friendly */
    h1 {
      font-size: 1.75rem;
      font-weight: 800;
      color: var(--deep-sage-text);
      letter-spacing: 0.12em;
      text-transform: uppercase;
      margin-bottom: 8px;
      line-height: 1.2;
    }

    /* Job Title */
    .title {
      font-size: 0.78rem;
      color: var(--savory-sage);
      font-weight: 700;
      letter-spacing: 0.2em;
      text-transform: uppercase;
      margin-bottom: 20px;
    }

    /* Divider Line */
    .accent-bar {
      height: 3px;
      width: 48px;
      background-color: var(--blush-beet);
      border-radius: 2px;
      margin-bottom: 28px;
    }

    /* Contact Links */
    .info-group {
      display: flex;
      flex-direction: column;
      gap: 14px;
      margin-bottom: 28px;
      width: 100%;
    }

    .info-link {
      font-size: 0.88rem;
      font-weight: 600;
      color: var(--deep-sage-text);
      text-decoration: none;
      letter-spacing: 0.04em;
      transition: opacity 0.2s ease;
    }

    .info-link:hover {
      color: var(--savory-sage);
    }

    /* Location */
    .location {
      font-size: 0.8rem;
      font-weight: 700;
      color: var(--savory-sage);
      letter-spacing: 0.12em;
      text-transform: uppercase;
      margin-bottom: 32px;
    }

    /* vCard QR Code Tile */
    .qr-section {
      background-color: #FFFFFF;
      padding: 14px;
      border-radius: 20px;
      display: inline-block;
      box-shadow: 0 4px 15px rgba(0, 0, 0, 0.05);
      border: 1px solid var(--avocado-smoothie);
    }

    .qr-section img {
      display: block;
      width: 150px;
      height: 150px;
    }
  </style>
</head>
<body>

  <div class="card-container">
    
    <!-- Prominent Name -->
    <h1>LEXI MANTILLA</h1>
    <p class="title">SALES ARCHITECT</p>
    
    <!-- Accent Line -->
    <div class="accent-bar"></div>

    <!-- Contact Info -->
    <div class="info-group">
      <a href="tel:09647568540" class="info-link">0964 756 8540</a>
      <a href="mailto:lexi.mantillaa@gmail.com" class="info-link">lexi.mantillaa@gmail.com</a>
      <a href="https://instagram.com/alxsjne" target="_blank" rel="noopener" class="info-link">@alxsjne</a>
    </div>

    <!-- Location -->
    <div class="location">
      MAKATI | PHILIPPINES
    </div>

    <!-- vCard QR Code (Includes TITLE:Sales Architect) -->
    <div class="qr-section">
      <img src="https://quickchart.io/qr?text=BEGIN%3AVCARD%0AVERSION%3A3.0%0AN%3AMantilla%3BLexi%0AFN%3ALexi+Mantilla%0AORG%3ADiversifiedsource+Inc.%0ATITLE%3ASales+Architect%0ATEL%3A%2B639647568540%0AEMAIL%3Alexi.mantillaa%40gmail.com%3BADR%3A%3B%3BMakati%3B%3B%3BPhilippines%0AEND%3AVCARD&size=150" alt="Scan to Save Contact">
    </div>

  </div>

</body>
</html>
